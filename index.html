<!doctype html>
<html>
<head><meta charset="utf-8"><title>Crop Disease Detection</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>Crop Disease Detection — Demo</h1>
  <p>Upload a leaf image (sample images are included in <code>dataset/</code>).</p>
  <form action="/predict" method="post" enctype="multipart/form-data">
    <input type="file" name="file" accept="image/*" required>
    <button type="submit">Predict</button>
  </form>
  <h3>Sample images (from dataset/train)</h3>
  <div>
    <img src="/static/sample_0.jpg" class="sample" width="120">
    <img src="/static/sample_1.jpg" class="sample" width="120">
    <img src="/static/sample_2.jpg" class="sample" width="120">
    <img src="/static/sample_3.jpg" class="sample" width="120">
    <img src="/static/sample_4.jpg" class="sample" width="120">
    <img src="/static/sample_5.jpg" class="sample" width="120">
  </div>
</div>
</body>
</html>
